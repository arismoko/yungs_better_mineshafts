[package]
name = "mod-bettermineshafts"
version = "0.3.0"
edition = "2024"
license = "LGPL-3.0-only"
description = "YUNG's Better Mineshafts for Sunrise: mineshafts generated by the mod's own structure type"
# Ported from: YUNG's Better Mineshafts 1.21.1-NeoForge-5.1.1 (YUNG-GANG/YUNGs-Better-Mineshafts, LGPL-3.0-only), Minecraft Java 1.21.1. The data files are the upstream mod's own,
# upgraded to 26.3; the Rust is written from the behaviour read in the upstream source.
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
